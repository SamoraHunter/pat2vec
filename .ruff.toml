# This is the correct format for ruff TOML config
line-length = 88

[lint]
select = ["ALL"]
ignore = [
    "BLE001",
    "G004",
    "TRY400",
    "E501",
    "D401",
    "T201",
    "D203",  # Incompatible with D211
    "CPY001",  # Missing copyright notice
    "E402",   # Module level import not at top
    "ANN001",   # Missing type annotation for args
    "ANN002",   # Missing positional arg type
    "ANN003",   # Missing vararg/kwarg annotation
    "ANN201",  # Missing return type for public functions
    "ANN401",  # Any types
    "D417",  # Missing argument in docstring (common)
    "S101",  # Use of assert detected - common in tests
    "PLR2004",  # Magic number comparison - common pattern
    "FBT001",  # Boolean-typed positional arg - sometimes intentional
    "FBT002",  # Boolean default positional arg - sometimes intentional
    "PTH118",  # Use Path with operator instead of os.path.join
    "PTH110",  # Use Path.parent instead of os.path.dirname
    "ERA001",  # Commented-out code
    "S311",  # Random module - sometimes intentional for testing
    "PLR0913",  # Too many arguments - intentional in some cases
    "PLR0917",  # Too many positional args
    "C901",  # Function too complex
    "D100",  # Missing docstring in public module
    "PLR0912",  # Too many branches
    "TRY401",  # raise inside try block
    "ARG001",  # Unused function argument
    "NPY002",  # Numpy type annotations
    "PLR0915",  # Too many statements
    "PTH120",  # os.path.dirname
    "PTH103",  # path.as_posix()
    "N806",  # Variable in function should be lowercase
    "PLC0415",  # Import inside function
    "TRY300",  # Consider moving to else block
    "S608",  # Possible SQL injection - uses SQLAlchemy safely
    "PTH123",  # Use Path.open() instead of open()
    "DTZ001",  # Naive datetime - sometimes intentional
    "PD004",  # Drop in inplace=True pattern - pandas compatibility
    "PGH003",  # Potential hardcoded password
    "ANN202",  # Missing return type for private functions
    "PTH113",  # os.path.abspath() - some uses intentional
    "PLR0911",  # Too many return statements - control flow clarity
    "PD008",  # Pandas method chain issues
    "PLW0602",  # Global variable in function
    "N803",  # Capitalized arg name
    "D205",  # Blank line after summary - style preference
    "ARG002",  # Unused argument - sometimes needed for interface
    "N802",  # Typo in test name
