    "PERF401",  # List comprehension optimization
    "DTZ007",  # Naive datetime - sometimes intentional
    "INP001",  # Missing __init__ in package
    "PTH122",  # os.path.split()
    "B018",  # Useless expression
    "N816",  # Mixed case variable in class
    "PD015",  # Power operation
    "PD003",  # pd.to_datetime
    "S110",  # Hardcoded file path
    "D104",  # Missing docstring in package
    "TRY301",  # Consider raising exception class directly
    "PLW1510",  # Exception not specified
    "SLF001",  # Private member access
    "PD011",  # pandas.to_numeric
    "PLE1205",  # Ineffective format 1st arg
  
    "SIM113",  # Use enumerate
    "S301",  # Pickle imports
    "TRY002",  # Caught specific exception
    "PLW2901",  # Reassign in loop
    "D107",  # Missing docstring in init
    "SIM115",  # String patterns
    "DTZ002",  # Naive datetime
    "PLW0642",  # Self/cls assigned to variable
    "SIM105",  # Use context manager for file handling
    "PYI056",  # Data class field order
    "D404",  # First word should not be the module name
    "ARG004",  # Unused static method arg
    "TD002",  # Missing todo author
    "TD003",  # Missing todo link
    "FIX001",  # Fixme detected
    "FIX002",  # FIXME detected
    "D102",  # Missing docstring in method
    "G001",  # Logging using string format
    "S112",  # Potentially misused key in dict
    "PTH119",  # os.path.isfile()
    "TRY004",  # Raised exception class without instantiation
    "RUF001",  # Typo in code
    "ISC001",  # Line too long after breaking
    "N801",  # Class name should use CapWords
    "S104",  # Possible hardcoded path
    "DTZ003",  # Naive datetime
    "B904",  # raise inside except without from
    "PTH107",  # path.rename()
    "PTH100",  # path.mkdir()
    "D103",  # Missing docstring in function
    "PTH109",  # path.exists()
    "F405",  # Import may be undefined
    "S108",  # Hardcoded file path
    "E701",  # Multiple statements on one line
    "PERF203",  # List comprehension optimization
    "PLW0603",  # Using global
    "S507",  # Too large buffer for socket.recv
    "DTZ005",  # Naive datetime - sometimes intentional
    "SIM102",  # Nested if statements
    "S607",  # Subprocess with hardcoded command
    "DTZ004",  # Naive datetime
    "B023",  # Loop variable bound to function
    "PTH112",  # os.path.exists()
    "S105",  # Hardcoded password
    "A001",  # Arg shadows builtin
    "F403",  # Import * used
    "COM819",  # Trailing comma on bare tuple
    "D101",  # Missing docstring in class
    "F701",  # Syntax error
    "PLR5501",  # elif with nested if
    "E722",  # Bare except
    "ARG005",  # Unused lambda
    "B008",  # Default arg mutable
    "ANN204",  # Private return type
    "D105",  # Docstring should be unchanged
    "FBT003",  # Boolean positional arg in function call
    "PTH104",  # path.rmdir()
    "D400",  # First line should end with period
    "D415",  # Docstring should be imperative mood
    "E721",  # Type comparison
    "A004",  # Shadowed builtin
    "F821",  # Undefined name
    "EXE003",  # Shebang not executable
    "EXE001",  # shebang not first line
    "EXE005",  # shebang with python
    "G003",  # Logging f-string
    "PLW0127",  # Shadowing name
    "TRY203",  # Try except raise
    "DTZ011",  # Naive datetime
]

exclude = [
    "**/__pycache__",
    "**/*.egg",
    "*.egg-info",
    "pat2vec/tests/",
    ".ai/",
    ".skills/",
    "notebooks/",
    "test_files/",
    "legacy/",
    "docs/",
    "test_*.py",
    "*_test.py",
    "test_isolation_fix.py",
    "test_elastic_credentials_textual_obs_get.py",
    "*.ipynb",
]
